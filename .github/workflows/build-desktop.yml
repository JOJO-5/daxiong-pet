name: Build desktop packages
on:
  push:
    branches: [main, feat/local-ai-chat, feat/pet-quick-chat]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || (github.head_ref != 'feat/local-ai-chat' && github.head_ref != 'feat/pet-quick-chat')
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: daxiong-windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: daxiong-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: daxiong-macos-x64
          - name: Linux x64 (X11)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: daxiong-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libx11-dev xvfb dbus-x11
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend image loading
        run: npm test
      - name: Test engine
        env:
          DAXIONG_TEST_NATIVE_CREDENTIALS: ${{ runner.os != 'Linux' && '1' || '0' }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and stage bundled CPU AI
        run: python scripts/prepare-bundled-ai.py --work ai-build
      - name: Run native bundled model
        run: python scripts/smoke-bundled-ai.py --ai ai-build/ai
      - name: Build packages
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ai-build/tauri-ai.json
        env:
          NO_STRIP: true
          MACOSX_DEPLOYMENT_TARGET: "14.0"
      - name: Smoke test Linux single instance
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash scripts/smoke-linux.sh
      - name: Native Windows input and tug smoke
        if: runner.os == 'Windows'
        run: python scripts/smoke-windows.py --application src-tauri/target/${{ matrix.target }}/release/daxiong-pet.exe --out test-results/windows
      - name: Install Windows movement recorder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
      - name: Native Windows ball and frisbee movement trace
        if: runner.os == 'Windows'
        run: python scripts/motion-windows.py --application src-tauri/target/${{ matrix.target }}/release/daxiong-pet.exe --out test-results/windows-motion
      - name: Native macOS startup smoke
        if: runner.os == 'macOS'
        run: swift scripts/smoke-macos.swift "$PWD/src-tauri/target/${{ matrix.target }}/release/daxiong-pet" test-results/macos
      - name: Upload native platform evidence
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          if-no-files-found: warn
          path: test-results/
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Stage light package without chat or vision weights
        run: python scripts/stage-light-ai.py --source ai-build/ai --out ai-build/ai-light --config ai-build/tauri-light.json
      - name: Build light packages
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ai-build/tauri-light.json
        env:
          NO_STRIP: true
          MACOSX_DEPLOYMENT_TARGET: "14.0"
      - name: Upload light packages
        uses: actions/upload-artifact@v4
        with:
          name: light-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  prerelease:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/local-ai-chat' || github.ref == 'refs/heads/feat/pet-quick-chat')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "*daxiong-*"
          path: release-artifacts
      - name: Require regression of unchanged application source
        run: |
          python3 - <<'PYGATE'
          import json, os, subprocess, time
          allowed={'scripts/stage-ai-resources.py','scripts/smoke-bundled-ai.py','.github/workflows/build-desktop.yml','.github/workflows/diagnose-ai-build.yml'}
          for attempt in range(120):
              runs=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/workflows/e2e-desktop.yml/runs?per_page=50']))['workflow_runs']
              qualified=None
              for r in runs:
                  if r['status']!='completed' or r['conclusion']!='success': continue
                  subprocess.run(['git','fetch','origin',r['head_sha']],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  changed=subprocess.check_output(['git','diff','--name-only',r['head_sha'],os.environ['GITHUB_SHA']],text=True).splitlines()
                  if all(name in allowed or name.startswith('docs/') for name in changed):
                      qualified=r;break
              if qualified:
                  print('Qualified desktop regression:',qualified['html_url'])
                  open('validated-e2e-url.txt','w').write(qualified['html_url'])
                  break
              time.sleep(20)
          else: raise RuntimeError('regression for unchanged application source not completed')
          PYGATE
      - name: Prepare full and light downloads
        run: python3 scripts/prepare-release.py --artifacts release-artifacts --out release-assets --bundled-ai --with-light --move
      - name: Publish complete AI preview
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          printf "\n桌面回归：%s\n四平台内置构建：https://github.com/%s/actions/runs/%s\n" "$(cat validated-e2e-url.txt)" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/release-notes-ai-preview.md
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Version already published; existing assets are preserved."; exit 0; fi
          export RELEASE_TAG="$TAG"
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --draft --prerelease --title "大熊 $TAG · CPU AI 完整版与轻量版" --notes-file docs/release-notes-ai-preview.md
          python3 - <<'PYVERIFY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases?per_page=100']))
          release=next(r for r in releases if r['tag_name']==os.environ['RELEASE_TAG'])
          assert release['draft']
          local={p.name:p for p in Path('release-assets').iterdir() if p.is_file()}
          uploaded={a['name']:a for a in release['assets']}
          assert len(local)==11 and set(uploaded)==set(local),'incomplete full/light release'
          for name,path in local.items():
              assert uploaded[name]['size']==path.stat().st_size
              with path.open('rb') as f: digest='sha256:'+hashlib.file_digest(f,'sha256').hexdigest()
              assert uploaded[name]['digest']==digest,name
          print('Verified ten full/light installers and checksums on GitHub')
          PYVERIFY
          gh release edit "$TAG" --draft=false --prerelease --latest=false
