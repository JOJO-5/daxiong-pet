name: Build desktop packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: daxiong-windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: daxiong-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: daxiong-macos-x64
          - name: Linux x64 (X11)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: daxiong-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libx11-dev xvfb dbus-x11
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend image loading
        run: npm test
      - name: Test engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build packages
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          NO_STRIP: true
      - name: Smoke test Linux single instance
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash scripts/smoke-linux.sh
      - name: Native Windows input and tug smoke
        if: runner.os == 'Windows'
        run: python scripts/smoke-windows.py --application src-tauri/target/${{ matrix.target }}/release/daxiong-pet.exe --out test-results/windows
      - name: Install Windows movement recorder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
      - name: Native Windows ball and frisbee movement trace
        if: runner.os == 'Windows'
        run: python scripts/motion-windows.py --application src-tauri/target/${{ matrix.target }}/release/daxiong-pet.exe --out test-results/windows-motion
      - name: Native macOS startup smoke
        if: runner.os == 'macOS'
        run: swift scripts/smoke-macos.swift "$PWD/src-tauri/target/${{ matrix.target }}/release/daxiong-pet" test-results/macos
      - name: Upload native platform evidence
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          if-no-files-found: warn
          path: test-results/
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/daxiong-pet.exe
