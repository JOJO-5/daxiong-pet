name: Desktop E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    name: Real Tauri WebKit E2E (Linux X11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev xvfb dbus-x11 webkit2gtk-driver openbox picom ffmpeg xdotool x11-utils imagemagick fonts-noto-cjk
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol,e2e
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify predictable controls, help, memory feedback and quiet companionship
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/ux"
          E2E_SCRIPT: scripts/e2e-ux.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify and record native tug interaction
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/tug"
          E2E_SCRIPT: scripts/e2e-tug.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record atomic ball and frisbee release in both directions
        env:
          E2E_RECORD: "1"
          E2E_FPS: "60"
          E2E_OUT: "test-results/handoff"
          E2E_SCRIPT: scripts/e2e-handoff.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record frisbee glide, biting and reusable return
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/frisbee"
          E2E_SCRIPT: scripts/e2e-frisbee.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Upload tug and frisbee recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-interaction-recordings
          path: |
            test-results/tug/
            test-results/frisbee/
            test-results/handoff/
      - name: Run native E2E
        env:
          E2E_MEMORY: "1"
          E2E_ENCOUNTERS: "1"
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record native visual validation
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/video"
          E2E_SCRIPT: scripts/e2e-video.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record bidirectional carrying validation
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/carry"
          E2E_SCRIPT: scripts/e2e-carry.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify fetch variety
        env:
          E2E_RECORD: "0"
          E2E_FUN_SCOPE: fetch
          E2E_OUT: "test-results/fun-fetch"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify command learning and restart
        env:
          E2E_RECORD: "0"
          E2E_FUN_SCOPE: learning
          E2E_OUT: "test-results/fun-learning"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record four tricks
        env:
          E2E_RECORD: "1"
          E2E_FUN_SCOPE: tricks
          E2E_OUT: "test-results/fun-tricks"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify hidden treat search and game switching
        env:
          E2E_RECORD: "0"
          E2E_FUN_SCOPE: snack
          E2E_OUT: "test-results/fun-snack"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record biscuit taking and chewing
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/treat"
          E2E_SCRIPT: scripts/e2e-treat.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify feeding cancellation and legacy pets
        env:
          E2E_RECORD: "0"
          E2E_TREAT_SCOPE: compat
          E2E_OUT: "test-results/treat-compat"
          E2E_SCRIPT: scripts/e2e-treat.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify native menus, shortcut persistence and rollback
        env:
          E2E_OUT: "test-results/menu"
          E2E_SCRIPT: scripts/e2e-menu.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record native menus and nearby panel
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/menu-video"
          E2E_SCRIPT: scripts/e2e-menu.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Build with production timing
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - name: Verify production encounter cadence
        env:
          E2E_SCRIPT: scripts/e2e-production.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-results
          path: test-results/
