name: Desktop E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    name: Real Tauri WebKit E2E (Linux X11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev xvfb dbus-x11 webkit2gtk-driver openbox picom ffmpeg xdotool x11-utils imagemagick fonts-noto-cjk
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol,e2e
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify and record native head and belly petting
        env:
          E2E_RECORD: "1"
          E2E_FPS: "60"
          E2E_OUT: "test-results/petting"
          E2E_SCRIPT: scripts/e2e-petting.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify and record rapid gaze dizziness and recovery
        env:
          E2E_RECORD: "1"
          E2E_FPS: "60"
          E2E_OUT: "test-results/dizzy"
          E2E_SCRIPT: scripts/e2e-dizzy.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify speech bubble bounds and complete long messages in native WebKit
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/bubbles"
          E2E_SCRIPT: scripts/e2e-bubbles.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify predictable controls, help, memory feedback and quiet companionship
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/ux"
          E2E_SCRIPT: scripts/e2e-ux.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify and record native tug interaction
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/tug"
          E2E_SCRIPT: scripts/e2e-tug.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record atomic ball and frisbee release in both directions
        env:
          E2E_RECORD: "1"
          E2E_FPS: "60"
          E2E_OUT: "test-results/handoff"
          E2E_SCRIPT: scripts/e2e-handoff.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record frisbee glide, biting and reusable return
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/frisbee"
          E2E_SCRIPT: scripts/e2e-frisbee.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Upload tug and frisbee recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-interaction-recordings
          path: |
            test-results/tug/
            test-results/frisbee/
            test-results/handoff/
      - name: Run native E2E
        env:
          E2E_MEMORY: "1"
          E2E_ENCOUNTERS: "1"
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record native visual validation
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/video"
          E2E_SCRIPT: scripts/e2e-video.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record bidirectional carrying validation
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/carry"
          E2E_SCRIPT: scripts/e2e-carry.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify fetch variety
        env:
          E2E_RECORD: "0"
          E2E_FUN_SCOPE: fetch
          E2E_OUT: "test-results/fun-fetch"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify command learning and restart
        env:
          E2E_RECORD: "0"
          E2E_FUN_SCOPE: learning
          E2E_OUT: "test-results/fun-learning"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record four tricks
        env:
          E2E_RECORD: "1"
          E2E_FUN_SCOPE: tricks
          E2E_OUT: "test-results/fun-tricks"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify hidden treat search and game switching
        env:
          E2E_RECORD: "0"
          E2E_FUN_SCOPE: snack
          E2E_OUT: "test-results/fun-snack"
          E2E_SCRIPT: scripts/e2e-fun.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record biscuit taking and chewing
        env:
          E2E_RECORD: "1"
          E2E_OUT: "test-results/treat"
          E2E_SCRIPT: scripts/e2e-treat.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify feeding cancellation and legacy pets
        env:
          E2E_RECORD: "0"
          E2E_TREAT_SCOPE: compat
          E2E_OUT: "test-results/treat-compat"
          E2E_SCRIPT: scripts/e2e-treat.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify native menus, shortcut persistence and rollback
        env:
          E2E_OUT: "test-results/menu"
          E2E_SCRIPT: scripts/e2e-menu.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record native menus and nearby panel
        env:
          DAXIONG_POINTER_TRACE: '1'
          E2E_RECORD: "1"
          E2E_OUT: "test-results/menu-video"
          E2E_SCRIPT: scripts/e2e-menu.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify native download settings spacing at normal and narrow sizes
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/missing-ai-synthetic
          E2E_OUT: test-results/ai-download-layout
          E2E_SCRIPT: scripts/e2e-ai-download-layout.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify external chat without bundled model files
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/missing-ai-synthetic
          E2E_RECORD: "1"
          E2E_OUT: "test-results/ai-external"
          E2E_SCRIPT: scripts/e2e-ai-external.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Stage built-in CPU model, vision and native OCR
        run: python scripts/prepare-bundled-ai.py --work ai-build
      - name: Verify real native offline chat, cancellation and persistence
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai
          E2E_RECORD: "1"
          E2E_OUT: "test-results/ai-chat"
          E2E_SCRIPT: scripts/e2e-ai-chat.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify AI bubble reading time and speech priority
        env:
          E2E_VISUAL: "1"
          E2E_OUT: "test-results/ai-bubble"
          E2E_SCRIPT: scripts/e2e-ai-bubble.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Record mouse follow switch and chat motions
        env:
          E2E_RECORD: "1"
          E2E_FPS: "60"
          E2E_OUT: "test-results/chat-motion"
          E2E_SCRIPT: scripts/e2e-chat-motion.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify grouped settings, temporary quiet and reply rereading
        env:
          E2E_RECORD: "1"
          E2E_REPLY_EXPIRY: "1"
          E2E_OUT: "test-results/companion-ux"
          E2E_SCRIPT: scripts/e2e-companion-ux.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify real CPU chat drives pet motion and bubble
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai
          E2E_RECORD: "1"
          E2E_OUT: "test-results/chat-motion-real"
          E2E_SCRIPT: scripts/e2e-chat-motion-real.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify compact pet input, shared chat and real CPU reply
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai
          E2E_RECORD: "1"
          E2E_AI_QUICK_CPU: "1"
          E2E_OUT: "test-results/ai-quick"
          E2E_SCRIPT: scripts/e2e-ai-quick.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify native capture, OCR, separate service scopes and memory
        env:
          E2E_AI_VISION: "1"
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai
          E2E_RECORD: "1"
          E2E_OUT: "test-results/ai-observation"
          E2E_SCRIPT: scripts/e2e-ai-observation.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Download fixed optional acceleration test model
        run: |
          python3 - <<'PYMODEL'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('litert_stage','scripts/stage-litert-native.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.download(module.SOURCES['test_model'],Path('ai-build/optional-test.litertlm'))
          PYMODEL
      - name: Verify optional download, cancellation and unsupported GPU fallback
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai
          LITERT_TEST_MODEL: ${{ github.workspace }}/ai-build/optional-test.litertlm
          E2E_RECORD: '1'
          E2E_OUT: test-results/acceleration-download
          E2E_SCRIPT: scripts/research/e2e-acceleration-download.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Verify corrupted optional component automatically recovers on CPU
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai
          E2E_RECORD: '1'
          E2E_OUT: test-results/acceleration-fallback
          E2E_SCRIPT: scripts/research/e2e-acceleration-fallback.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Stage light runtime and OCR without chat weights
        run: python scripts/stage-light-ai.py --source ai-build/ai --out ai-build/ai-light --config ai-build/tauri-light.json
      - name: Verify GUI downloads and uses real CPU model in light edition
        env:
          DAXIONG_AI_RESOURCE_DIR: ${{ github.workspace }}/ai-build/ai-light
          E2E_RECORD: "1"
          E2E_OUT: "test-results/ai-light"
          E2E_SCRIPT: scripts/e2e-ai-light.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - name: Build with production timing
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - name: Verify production encounter cadence
        env:
          E2E_SCRIPT: scripts/e2e-production.py
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/e2e-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-results
          path: test-results/
